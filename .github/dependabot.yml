# ─────────────────────────────────────────────────────────────────────
# O Dependabot, para as dependências deste repositório.
#
# O Astro e o `@astrojs/sitemap` só correm no build — geram `dist/`, e a
# imagem de produção nunca os vê. As dependências de `api/` **correm a
# sério em produção**, por isso têm janela própria e mais apertada: uma
# vulnerabilidade ali é uma vulnerabilidade no site, não um incómodo de
# build.
#
# O que **não** pode esperar, nos dois casos, são os avisos de
# segurança. Esses o Dependabot abre logo, fora desta agenda, e têm de
# ser tratados no dia.
# ─────────────────────────────────────────────────────────────────────
version: 2

updates:
  # ── As dependências de build (Astro) ────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Um PR por semana com tudo o que for menor ou correcção. As
      # subidas de versão maior vêm sozinhas, para se olhar para elas.
      minor-e-patch:
        update-types: [minor, patch]
    labels: [dependências]

  # ── As dependências da API — correm a sério em produção ────────────
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(api)
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    labels: [dependências, produção]

  # ── A imagem base do container ────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Lisbon
    commit-message:
      prefix: docker
    labels: [dependências, infraestrutura]

  # ── As actions do próprio CI ──────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
    labels: [dependências, infraestrutura]
