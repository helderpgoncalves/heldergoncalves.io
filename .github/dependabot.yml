# ─────────────────────────────────────────────────────────────────────
# O Dependabot, para as três coisas que este repositório tem versões de.
#
# Em produção não corre nenhuma dependência de terceiros — o servidor usa
# só módulos internos do Node. As dependências que aqui estão são de
# build (o Astro) e de infraestrutura (a imagem base, as actions), e é
# por isso que os grupos são poucos e as janelas são largas: não há aqui
# uma vulnerabilidade em produção à espera de um patch semanal.
#
# O que **não** pode esperar são os avisos de segurança. Esses o
# Dependabot abre logo, fora desta agenda, e têm de ser tratados no dia.
# ─────────────────────────────────────────────────────────────────────
version: 2

updates:
  # ── As dependências de build ──────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Um PR por semana com tudo o que for menor ou correcção. As
      # subidas de versão maior vêm sozinhas, para se olhar para elas.
      minor-e-patch:
        update-types: [minor, patch]
    labels: [dependências]

  # ── A imagem base do container ────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Lisbon
    commit-message:
      prefix: docker
    labels: [dependências, infraestrutura]

  # ── As actions do próprio CI ──────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
    labels: [dependências, infraestrutura]
