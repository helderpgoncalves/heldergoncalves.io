name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      # O build apanha artigos com o cabeçalho mal escrito (data, título, resumo em falta).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
