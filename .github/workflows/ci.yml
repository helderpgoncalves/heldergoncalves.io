name: CI
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Barra textos com marcadores por preencher, travessões, brasileirismos e cabeçalhos incompletos.
      - run: npm run texto
      - run: npm audit --omit=dev --audit-level=high
      # O build apanha artigos com o cabeçalho mal escrito (data, título, resumo em falta).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
