# ─────────────────────────────────────────────────────────────────────
# Análise estática de segurança.
#
# Vale a pena aqui porque este repositório não é só um site: tem uma API
# que recebe formulários, manda email, guarda uma lista de pessoas e fala
# com um modelo. É esse código que interessa analisar — em Python
# (`api/app/`) e no JavaScript/TypeScript do frontend.
#
# Corre nos pull requests e uma vez por semana — as regras do CodeQL
# mudam sem o código mudar, e uma corrida semanal apanha isso.
# ─────────────────────────────────────────────────────────────────────
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisar:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
