# ─────────────────────────────────────────────────────────────
# nginx — serve o site estático do Astro (heldergoncalves.io).
# gzip, cache de assets com hash, HTML sem cache, headers de
# segurança e URLs "limpos" (directory-style do Astro).
# ─────────────────────────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Segurança básica
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml application/xml application/xml+rss
        application/json application/javascript application/rss+xml
        image/svg+xml font/woff font/woff2 application/manifest+json;

    # Assets com hash (/_astro/…) — imutáveis, cache longo.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Ficheiros estáticos com extensão conhecida — cache médio.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|avif|woff2?|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # sitemap / rss / robots — sem cache agressivo.
    location ~* \.(?:xml|txt|json|webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }

    # URLs do Astro (build "directory"): /blog → /blog/index.html.
    # Tenta ficheiro exato, depois /pasta/, senão 404 estático.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Página de erro 404 (usa a home; troca por /404.html se criares uma).
    error_page 404 /index.html;
}
