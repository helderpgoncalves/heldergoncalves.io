# ─────────────────────────────────────────────────────────────────────
# heldergoncalves.io — ambiente de desenvolvimento local, com hot
# reload a sério nos dois lados: o Astro com o seu próprio HMR (Vite) e
# a API FastAPI com `uvicorn --reload`. Uma porta só — o Astro faz de
# proxy para /api, por trás do mesmo servidor de dev.
#
# Uso:
#   cp .env.example .env   # preenche o que precisares — tudo é opcional
#   docker compose -f docker-compose.dev.yml up --build
#
# Fica em http://localhost:3900. Muda um ficheiro em src/ ou api/app/ e
# recarrega sozinho — nada de rebuild de imagem. O nome do projecto
# Compose ("heldergoncalvesio-dev") isola a rede e os volumes dos de
# produção; a porta é a 3900 para não disputar a 3000 com outro
# projecto na mesma máquina.
#
# `postgres` e `garage` são a base de dados e o armazém dos ficheiros
# partilhados — ver docs/arquitetura.md e api/app/armazem.py. Os dois guardam
# tudo em volumes nomeados, como `site-data-dev`: apagar o container
# não apaga o que lá está, só `docker compose down -v` o faz.
# ─────────────────────────────────────────────────────────────────────
name: heldergoncalvesio-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: helder
      POSTGRES_PASSWORD: helder
      POSTGRES_DB: heldergoncalves
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ./api/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helder -d heldergoncalves"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  # O armazém S3 do desenvolvimento. Garage e não MinIO: é um binário
  # sem nada atrás, e corre no que o MinIO pedia só para arrancar. A
  # configuração está em docker/garage.toml; o que é preciso fazer da
  # primeira vez (dar espaço ao nó, criar o balde e a chave) está no
  # DEPLOY.md — são três comandos, uma vez só.
  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-data-dev:/var/lib/garage
    ports:
      - "3900:3900"   # a API S3 — só em desenvolvimento
    mem_limit: 256m

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "cd api && PYTHONPATH=/app/api uvicorn app.main:app --host 0.0.0.0 --port 3000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      KNOWLEDGE_DIR: /app/knowledge
      DATABASE_URL: postgresql+asyncpg://helder:helder@postgres:5432/heldergoncalves
      TEST_DATABASE_URL: postgresql+asyncpg://helder:helder@postgres:5432/heldergoncalves_test
      # Sem estas, a API guarda no disco (armazem.py decide). Aqui
      # estão para o desenvolvimento correr contra um S3 a sério — as
      # chaves saem do `garage key create`, ver DEPLOY.md.
      ARMAZEM_ENDPOINT: http://garage:3900
      ARMAZEM_BALDE: ficheiros
      ARMAZEM_REGIAO: garage
      ARMAZEM_CHAVE: ${ARMAZEM_CHAVE:-}
      ARMAZEM_SECRETA: ${ARMAZEM_SECRETA:-}
    volumes:
      - ./api/app:/app/api/app
      - ./api/alembic:/app/api/alembic
      - ./api/alembic.ini:/app/api/alembic.ini
      - ./api/tests:/app/api/tests
      - ./api/pytest.ini:/app/api/pytest.ini
      - ./knowledge:/app/knowledge
      - site-data-dev:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  site:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npx astro dev --host 0.0.0.0 --port 3000"
    ports:
      - "3900:3000"
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./astro.config.mjs:/app/astro.config.mjs
      - ./tailwind.config.mjs:/app/tailwind.config.mjs
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      - api
    mem_limit: 512m

volumes:
  site-data-dev:
  postgres-data-dev:
  garage-data-dev:
